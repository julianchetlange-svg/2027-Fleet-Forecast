<title>McCoy's Fleet Forecast 2027</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: brand header band, sticky tab bar, then one working surface per tab: summary first, district rows that open to locations, detail below. */
:root{
  --brand:#0D5540; --brand-ink:#ffffff; --sun:#FFE901;
  --bg:#F3F5F1; --panel:#FFFFFF; --panel-2:#E9EFE9; --line:#D4DDD5; --line-strong:#B3C2B6;
  --fg:#10261D; --muted:#4E6358; --faint:#7A8C81;
  --accent:#0D5540; --accent-soft:#DCEBE1; --hl:#FFF6A8; --hl-ink:#3D3300;
  --s-base:#1E8A5E; --s-scen:#C08A00;
  --up:#A33A16; --down:#16794A; --warn:#8A6100; --warn-bg:#FFF3C4; --bad:#A3201C; --bad-bg:#FCE3DE;
  --font-display:"Zilla Slab", Rockwell, "Roboto Slab", Georgia, serif;
  --font-body:"Public Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B2219; --panel:#123B2E; --panel-2:#174535; --line:#255C48; --line-strong:#3A7560;
  --fg:#E8F1EB; --muted:#A9C2B4; --faint:#7E9B8C;
  --accent:#7FD3A8; --accent-soft:#1B4D3B; --hl:#4A4310; --hl-ink:#FFF2A0;
  --s-base:#2F8C66; --s-scen:#B08A0C;
  --up:#FF9B73; --down:#6FD9A0; --warn:#F2C94C; --warn-bg:#3A3410; --bad:#FFB4A8; --bad-bg:#4A1A14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B2219; --panel:#123B2E; --panel-2:#174535; --line:#255C48; --line-strong:#3A7560;
  --fg:#E8F1EB; --muted:#A9C2B4; --faint:#7E9B8C;
  --accent:#7FD3A8; --accent-soft:#1B4D3B; --hl:#4A4310; --hl-ink:#FFF2A0;
  --s-base:#2F8C66; --s-scen:#B08A0C;
  --up:#FF9B73; --down:#6FD9A0; --warn:#F2C94C; --warn-bg:#3A3410; --bad:#FFB4A8; --bad-bg:#4A1A14; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1800px;margin:0 auto}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--s-scen);outline-offset:2px}

/* header */
.band{background:var(--brand);color:var(--brand-ink);padding-block:14px}
.band .wrap{display:flex;gap:16px 24px;align-items:center;flex-wrap:wrap}
.band img{height:52px;width:auto;border-radius:6px;display:block}
.band .ttl{flex:1 1 280px;min-width:0}
.band h1{font-size:clamp(22px,3vw,30px);font-weight:700;line-height:1.1}
.band .sub{font-size:13px;opacity:.85;margin-top:2px}
.band .tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.base{background:rgba(255,255,255,.14);color:#fff}
.pill.scen{background:var(--sun);color:#1d1a00}
.btn{border:1px solid var(--line-strong);background:var(--panel);color:var(--fg);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:#1d1a00}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.5);color:#fff}
.btn.small{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:default}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:12px 14px;text-decoration:none;color:var(--muted);font-weight:600;font-size:13.5px;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--sun)}
.tabs a:hover{color:var(--fg)}

main{padding-block:20px 48px}
section.view{display:flex;flex-direction:column;gap:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.panel h2{font-size:19px;font-weight:600}
.panel h3{font-size:16px;font-weight:600}
.phead{display:flex;gap:8px 16px;align-items:baseline;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.lede{color:var(--muted);font-size:13px;max-width:72ch;margin:4px 0 0}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--font-display);font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12.5px;color:var(--muted)}
.kpi.lead{background:var(--brand);border-color:var(--brand);color:#fff}
.kpi.lead .eyebrow,.kpi.lead .d{color:rgba(255,255,255,.8)}
.kpi.lead .v{color:var(--sun)}
.up{color:var(--up)} .down{color:var(--down)}
.chip{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:600;white-space:nowrap}
.chip.c{background:var(--accent-soft);color:var(--accent)}
.chip.s{background:var(--panel-2);color:var(--muted)}
.chip.w{background:var(--warn-bg);color:var(--warn)}
.chip.m{background:var(--hl);color:var(--hl-ink)}

.callout{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.callout > div{border-left:4px solid var(--line-strong);padding:4px 0 4px 12px;min-width:0}
.callout > div.op{border-left-color:var(--s-base)}
.callout > div.ch{border-left-color:var(--s-scen)}
.callout p{margin:4px 0 0;color:var(--muted);font-size:13px}
.callout b{color:var(--fg)}

.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}

.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 11px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--panel)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#0B2219}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#0B2219}}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--line-strong)}
.tip{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:50;min-width:150px;max-width:260px}
.tip .t{font-weight:700;margin-bottom:4px}
.tip .r{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{white-space:normal;vertical-align:bottom;line-height:1.25}
#tLoc td:first-child,#tAssetDet td:first-child{white-space:normal;min-width:120px}
#tLoc,#tMonth,#tAssetDet{font-size:12.5px}
#tLoc th,#tLoc td,#tMonth th,#tMonth td{padding-left:6px;padding-right:6px}
th{font-size:11.5px;font-weight:600;color:var(--muted);background:var(--panel-2);position:sticky;top:0;z-index:1}
th,th.n,td.n{text-align:center}
tbody tr:hover td{background:var(--panel-2)}
tr.tot td{font-weight:700;border-top:2px solid var(--line-strong);background:var(--panel-2)}
tr.moved td{background:var(--hl)}
tr.moved td, tr.moved td .sub2{color:var(--hl-ink)}
tr.grp td{font-weight:700;background:var(--accent-soft);color:var(--accent)}
td .sub2{display:block;font-size:11.5px;color:var(--faint)}
td select{padding:4px 6px;border:1px solid var(--line-strong);border-radius:6px;background:var(--panel);max-width:190px}
.bar-cell{display:flex;align-items:center;gap:8px;justify-content:flex-end}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted);font-weight:600}
.filters select,.filters input{padding:6px 8px;border:1px solid var(--line-strong);border-radius:6px;background:var(--panel);min-width:0}
.filters input[type=search]{width:160px}

/* utilization cards */
.ucards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.ucard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ucard.changed{border-color:var(--s-scen);box-shadow:inset 4px 0 0 var(--s-scen)}
.ucard .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.ucard h3{font-size:17px}
.mrow{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,1fr));gap:4px 8px;font-size:12.5px;align-items:baseline}
.mrow.h{font-size:11px;color:var(--faint);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.04em}
.mrow span:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
.mrow span:first-child{color:var(--muted)}
.ucard .note{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.meter{height:8px;background:var(--panel-2);border-radius:4px;position:relative;overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}

/* assumptions */
.agrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:12.5px;font-weight:600}
.field small{color:var(--muted);font-size:12px}
.field input{padding:6px 8px;border:1px solid var(--line-strong);border-radius:6px;background:var(--panel);width:130px;font-variant-numeric:tabular-nums}
.rate-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.rate-grid label{display:flex;flex-direction:column;font-size:11px;color:var(--muted);gap:2px}
.rate-grid input{width:100%;padding:5px 6px;border:1px solid var(--line-strong);border-radius:6px;background:var(--panel);font-variant-numeric:tabular-nums}
.rules{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.rules li{padding-left:14px;position:relative;color:var(--muted);font-size:13px;max-width:90ch}
.rules li::before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:2px;background:var(--s-scen)}
.rules li b{color:var(--fg)}
.moves{display:flex;flex-direction:column;gap:6px}
.move{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--hl);color:var(--hl-ink);border-radius:8px;padding:6px 10px;font-size:12.5px;flex-wrap:wrap}
.empty{color:var(--muted);font-size:13px;padding:10px;border:1px dashed var(--line-strong);border-radius:8px}
.vol input{width:80px;padding:4px 6px;border:1px solid var(--line-strong);border-radius:6px;background:var(--panel);text-align:right}
.xbar{display:flex;gap:10px 14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-bg);color:var(--warn);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13px}
.xbar b{color:var(--fg)}
.xbar .st{font-size:12px;color:var(--muted)}
.xbar .st.dirty{color:var(--up);font-weight:600}
.caret{border:1px solid var(--line-strong);background:var(--panel);color:var(--accent);cursor:pointer;padding:0;margin-right:8px;font-size:13px;font-weight:700;line-height:1;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:5px;vertical-align:middle}
.caret:hover{background:var(--accent-soft);border-color:var(--accent)}
.caret[aria-expanded="true"]{transform:rotate(90deg);background:var(--accent-soft);border-color:var(--accent)}
@media (prefers-reduced-motion: no-preference){.caret{transition:transform .15s}}
tr.subrow td{font-size:12.5px;color:var(--muted);background:var(--panel)}
tr.subrow td:first-child{padding-left:40px}
tr.tot .caret{color:var(--fg)}
.mflag{display:block;margin-top:5px;padding:5px 9px;border-radius:6px;font-size:12px;font-weight:600;white-space:normal;line-height:1.35}
.mflag.red{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad)}
.mflag.amber{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn)}
.chip.red{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad)}
.kstick{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--tabsH,46px));z-index:4;background:var(--bg);padding-block:6px;margin-block:-6px}
.kpis.compact{grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:8px}
.kpis.compact .kpi{padding:8px 12px;gap:2px;border-radius:8px}
.kpis.compact .kpi .v{font-size:20px}
.kpis.compact .kpi .d{font-size:11.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kpis.compact .eyebrow{font-size:10px}
@media (max-width:700px){.kstick{position:static}}
.xbtn{position:relative}
.xbtn.needs-export{box-shadow:0 0 0 3px rgba(255,233,1,.55),0 0 14px 4px rgba(255,233,1,.55);border-color:#C9A800}
.xbtn.needs-export::after{content:"";position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:#D93A1E;border:2px solid #fff}
@media (prefers-reduced-motion: no-preference){
  .xbtn.needs-export{animation:xglow 1.6s ease-in-out infinite}
  @keyframes xglow{0%,100%{box-shadow:0 0 0 2px rgba(255,233,1,.45),0 0 6px 1px rgba(255,233,1,.35);transform:scale(1)}50%{box-shadow:0 0 0 4px rgba(255,233,1,.75),0 0 20px 6px rgba(255,233,1,.65);transform:scale(1.04)}}
}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:60}
@media (prefers-reduced-motion: no-preference){.ucard,.kpi{transition:border-color .2s}}
tr.drow td{font-weight:700;background:var(--panel-2)}
tr.lrow td:first-child{padding-left:22px}
tr.lrow.sub td:first-child{padding-left:44px}
.chip.k{background:var(--panel-2);color:var(--muted);font-weight:500}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:8px;font-size:12.5px;color:var(--muted)}
</style>
